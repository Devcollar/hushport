name: Feature request
description: Suggest an improvement for HushPort
title: "[Feature]: "
labels: ["enhancement", "beta"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: e.g. I want to hear Mac audio while walking to another room...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would use HushPort more often
        - Can't use HushPort without it
    validations:
      required: false
